<h1>Controle de Retiradas</h1>

<!-- Formulário para registrar retirada -->
<div class="form-container">
  <div class="input-group">
    <input type="text" [(ngModel)]="searchTerm" placeholder="Pesquisar Assistido" (input)="filterAssistidos()" class="input-field" />
    <select [(ngModel)]="novaRetirada.assistido_id" class="input-field">
      <option value="" disabled selected>Escolha o Assistido</option>
      <option *ngFor="let assistido of filteredAssistidos" [value]="assistido.id">{{ assistido.nome }}</option>
    </select>
    <input [(ngModel)]="novaRetirada.data_retirada" placeholder="Data" type="date" class="input-field" />
    <button (click)="registrarRetirada()" class="button">Registrar Retirada</button>
  </div>
</div>

<h3>Filtros</h3>
<div class="filters-container">
  <!-- Filtro por Assistido -->
  <div class="filter-item">
    <h4>Filtrar por Assistido</h4>
    <select [(ngModel)]="assistidoIdFilter" class="input-field">
      <option value="" disabled>Escolha o Assistido</option>
      <option *ngFor="let assistido of assistidos" [value]="assistido.id">{{ assistido.nome }}</option>
    </select>
    <button (click)="filtrarRetiradasPorAssistido()" class="button">Filtrar</button>
  </div>

  <!-- Filtro por Data -->
  <div class="filter-item">
    <h4>Filtrar por Data</h4>
    <input type="date" [(ngModel)]="dataFilter" class="input-field" />
    <button (click)="filtrarRetiradasPorData()" class="button">Filtrar</button>
  </div>

  <!-- Filtro por Intervalo de Data -->
  <div class="filter-item">
    <h4>Filtrar por Intervalo de Data</h4>
    <input type="date" [(ngModel)]="dataInicialFilter" class="input-field" />
    <input type="date" [(ngModel)]="dataFinalFilter" class="input-field" />
    <button (click)="filtrarRetiradasPorIntervalo()" class="button">Filtrar Intervalo</button>
  </div>

  <!-- Limpar Filtros -->
  <div class="filter-item">
    <button (click)="limparFiltros()" class="button-clear">Limpar Filtros</button>
  </div>
</div>

<h2>Retiradas Registradas</h2>
<ul class="retiradas-list">
  <li *ngFor="let retirada of retiradas" class="retirada-item">
    {{ retirada.nome }} - {{ retirada.data_retirada | date }}
    <button (click)="editarRetirada(retirada)" class="button">Alterar</button>
  </li>
</ul>
