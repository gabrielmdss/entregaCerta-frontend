<header class="desktop-header">
  <div class="logo">
    <a routerLink="/dashboard">Entrega Certa</a>
  </div>
  <nav [class.active]="menuActive">
    <ul>
      <li>
        <a routerLink="/dashboard" routerLinkActive="active">
          <i class="fa-solid fa-table-columns"></i> Dashboard
        </a>
      </li>
      <li>
        <a routerLink="/assistidos" routerLinkActive="active">
          <i class="fa-solid fa-handshake"></i> Assistidos
        </a>
      </li>
      <li>
        <a routerLink="/retiradas" routerLinkActive="active">
          <i class="fas fa-archive"></i> Retiradas
        </a>
      </li>
      <li>
        <a routerLink="/estoque" routerLinkActive="active">
          <i class="fa-solid fa-boxes-stacked"></i> Estoque
        </a>
      </li>
    </ul>
  </nav>
  <div class="menu-icon" (click)="toggleMenu()">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>
</header>
