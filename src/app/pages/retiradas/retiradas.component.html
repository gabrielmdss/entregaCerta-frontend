<div class="container">
  <h1>Controle de Retiradas</h1>
  <div class="form-container">
    <button (click)="openModalRegistrar(novaRetirada)" class="btn">
      <i class="fa fa-plus"></i> Registrar Retirada
    </button>
  </div>

  <h3>Filtros</h3>
  <div class="filters-container">
    <div class="filter-items-container">
      <div class="filter-item">
        <h4>Assistido</h4>
        <div class="form-group">
          <div class="input-group">
            <app-select
              [items]="assistidos"
              bindLabel="nome"
              bindValue="id"
              (selectChange)="onAssistidoSelecionado($event)"
              class="select"
            ></app-select>
          </div>
          <button (click)="filtrarRetiradasPorAssistido()" class="button">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>
      <div class="filter-item-intervalo">
        <h4>Intervalo de Data</h4>
        <div class="form-group">
          <div class="input-group">
            <input
              type="date"
              [(ngModel)]="dataInicialFilter"
              class="input-field"
            />
            <input
              type="date"
              [(ngModel)]="dataFinalFilter"
              class="input-field"
            />
          </div>
          <button
            (click)="filtrarRetiradasPorIntervalo()"
            class="button button-search"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="filter-btn-clean-filter">
      <button (click)="limparFiltros()" class="button-clear">
        <i class="fa-solid fa-broom"></i>
        Limpar Filtros
      </button>
    </div>
  </div>

  <h2>Retiradas Registradas</h2>

  <div *ngIf="isLoading" class="loading">Carregando retiradas...</div>

  <div *ngIf="!isLoading" class="page-size-selector">
    <label for="pageSize">Exibir:</label>
    <select
      id="pageSize"
      [(ngModel)]="selectedPageSize"
      (change)="changePageSize(selectedPageSize)"
    >
      <option *ngFor="let size of itemsPerPageOptions" [value]="size">
        {{ size }} itens
      </option>
    </select>
  </div>

  <ul *ngIf="!isLoading" class="retiradas-list">
    <li *ngFor="let retirada of retiradas" class="retirada-item">
      {{ retirada.nome }} - {{ retirada.data_retirada | date: 'MMM d, yyyy' : 'UTC' }}
      <button (click)="openModal(retirada)" class="button">
        <i class="fa-solid fa-pencil"></i> Alterar
      </button>
    </li>
  </ul>

  <div *ngIf="!isLoading" class="pagination">
    <button
      (click)="changePage(currentPage - 1)"
      [disabled]="currentPage === 1"
    >
      Anterior
    </button>
    <span>Página {{ currentPage }} de {{ totalPages }}</span>
    <button
      (click)="changePage(currentPage + 1)"
      [disabled]="currentPage === totalPages"
    >
      Próxima
    </button>
  </div>

  <div *ngIf="mostrarModal" class="modal-overlay">
    <dialog *ngIf="mostrarModal" class="modal">
      <div class="title-modal">
        <h5>Alterar Retirada</h5>
        <button class="close-button" (click)="closeModal()">&#10005;</button>
      </div>
      <div class="body-modal">
        <div>
          <label for="nome">Nome</label>
          <input
            id="nome"
            [(ngModel)]="retiradaEditada.nome"
            placeholder="Nome do assistido"
          />
        </div>
        <div>
          <label for="data_retirada">Data de Retirada</label>
          <input
            type="date"
            id="data_retirada"
            [(ngModel)]="retiradaEditada.data_retirada"
          />
        </div>
      </div>

      <div class="footer-modal">
        <button (click)="closeModal()" class="button-cancelar">Cancelar</button>
        <button (click)="confirmarAlteracao()" class="btn">
          <i class="fa fa-plus"></i> Cadastrar
        </button>
      </div>
    </dialog>
  </div>
  <div *ngIf="mostrarModalRegistrar" class="modal-overlay">
    <dialog *ngIf="mostrarModalRegistrar" class="modal">
      <div class="title-modal">
        <h5>Registrar Retirada</h5>
        <button class="close-button" (click)="closeModalRegistrar()">&#10005;</button>
      </div>
      <div class="body-modal">
        <div class="input-group">
          <app-select
            [items]="assistidos"
            bindLabel="nome"
            bindValue="id"
            (selectChange)="onAssistidoSelecionadoRegistrarRetirada($event)"
            style="width: 100%;"
          ></app-select>
        </div>
        <div>
          <label for="data_retirada">Data de Retirada</label>
          <input
            type="date"
            id="data_retirada"
            [(ngModel)]="novaRetirada.data_retirada"
          />
        </div>
      </div>

      <div class="footer-modal">
        <button (click)="closeModalRegistrar()" class="button-cancelar">Cancelar</button>
        <button (click)="registrarRetirada()" class="btn">
          <i class="fa fa-plus"></i> Registrar
        </button>
      </div>
    </dialog>
  </div>
</div>
