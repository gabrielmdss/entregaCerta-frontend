<div class="container">
  <h1>Gestão de Assistidos</h1>

  <div class="form-container">
    <input [(ngModel)]="novoAssistido.nome" placeholder="Nome" class="input-field" />
    <input [(ngModel)]="novoAssistido.documento" placeholder="Documento" class="input-field" />
    <button (click)="cadastrarAssistido()" class="btn">Cadastrar</button>
  </div>

  <!-- Campo de Pesquisa -->
  <div class="search-container">
    <input
      [(ngModel)]="searchTerm"
      (input)="filtrarAssistidos()"
      placeholder="Pesquisar por Nome ou Documento"
      class="input-field"
    />
  </div>

  <h2>Lista de Assistidos</h2>
  <ul class="assistidos-list">
    <li *ngFor="let assistido of assistidosFiltrados" class="assistido-item">
      {{ assistido.nome }} - {{ assistido.documento }}
      <button (click)="excluirAssistido(assistido.id)" class="btn btn-delete">Excluir</button>
    </li>
  </ul>
</div>
