<div class="container">
  <h1>Gestão de Assistidos</h1>

  <div class="search-container">
    <div class="input-wrapper">
      <input
        [(ngModel)]="searchTerm"
        (input)="filtrarAssistidos()"
        placeholder="Pesquisar por Nome ou Documento"
        class="input-field"
      />
      <i class="fa fa-search search-icon"></i> <!-- Ícone de lupa -->
    </div>
    <button (click)="cadastrarAssistido()" class="btn">
      <i class="fa fa-plus"></i> Cadastrar novo <!-- Ícone de "+" -->
    </button>
  </div>
  
  <h2>Lista de Assistidos</h2>

  <div *ngIf="isLoading" class="loading">Carregando relação de assistidos...</div>

  <ul *ngIf="!isLoading" class="assistidos-list">
    <li *ngFor="let assistido of assistidosFiltrados" class="assistido-item">
      {{ assistido.nome }} - {{ assistido.documento }}
      <button (click)="excluirAssistido(assistido.id)" class="btn btn-delete">Excluir</button>
    </li>
  </ul>
</div>
