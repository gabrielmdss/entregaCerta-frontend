<div class="container">
  <h1>Gestão de Assistidos</h1>

  <div class="search-container">
    <div class="input-wrapper">
      <input
        [(ngModel)]="searchTerm"
        (input)="filtrarAssistidos()"
        placeholder="Pesquisar por Nome ou Documento"
        class="input-field"
      />
      <i class="fa fa-search search-icon"></i>
    </div>
    <button (click)="openModal()" class="btn">
      <i class="fa fa-plus"></i> Cadastrar novo
    </button>
  </div>

  <h2>Lista de Assistidos</h2>

  <div *ngIf="isLoading" class="loading">
    Carregando relação de assistidos...
  </div>

  <ul *ngIf="!isLoading" class="assistidos-list">
    <li *ngFor="let assistido of assistidosFiltrados" class="assistido-item">
      <div class="assistido-info">
        <span class="nome">{{ assistido.nome }}</span>
        <span class="documento">{{
          assistido.documento | documentTranslate
        }}</span>
      </div>
      <div class="actions-buttons">
        <button (click)="openModalEditar(assistido.id)" class="btn-edit">
          <i class="fa-solid fa-pencil"></i> Editar
        </button>
        <button (click)="excluirAssistido(assistido.id)" class="btn-delete">
          <i class="fa-solid fa-trash"></i> Excluir
        </button>
      </div>
    </li>
  </ul>

  <div *ngIf="mostrarModal" class="modal-overlay"></div>

  <dialog *ngIf="mostrarModal" class="modal">
    <!-- Header do Modal com X para fechar -->
    <div class="title-modal">
      <h5>Cadastro de Novo Assistido</h5>
      <button class="close-button" (click)="closeModal()">&#10005;</button>
    </div>

    <!-- Conteúdo do Modal -->
    <div>
      <input
        id="nome"
        placeholder="Nome do assistido"
        [(ngModel)]="novoAssistido.nome"
      />
    </div>
    <div>
      <input
        type="text"
        id="numero_documento"
        [(ngModel)]="novoAssistido.documento"
        placeholder="Número de documento"
        appDocumentMask
      />
    </div>
    <div>
      <input
        type="date"
        id="data_nascimento"
        [(ngModel)]="novoAssistido.data_nascimento"
        placeholder="Data de Nascimento"
      />
    </div>
    <div>
      <input type="file" (change)="onFileChangeCadastrar($event)" />
      <div *ngIf="isUploading" class="spinner"></div>
      <img *ngIf="isUploading && novoAssistido.imagem" [src]="novoAssistido.imagem" width="200" height="200" />
    </div>

    <div class="footer-modal">
      <button (click)="closeModal()" class="button">Cancelar</button>
      <button (click)="cadastrarAssistido()" class="btn">
        <i class="fa fa-plus"></i> Cadastrar
      </button>
    </div>
  </dialog>

  <dialog *ngIf="mostrarModalEditar" class="modal">
    <!-- Header do Modal com X para fechar -->
    <div class="title-modal">
      <h5>Editar Dados do Assistido</h5>
      <button class="close-button" (click)="closeModalEditar()">
        &#10005;
      </button>
    </div>

    <!-- Conteúdo do Modal -->
    <div>
      <input
        id="nome"
        placeholder="Nome do assistido"
        [(ngModel)]="atualizarAssistido.nome"
      />
    </div>
    <div>
      <input
        type="text"
        id="numero_documento"
        [(ngModel)]="atualizarAssistido.documento"
        placeholder="Número de documento"
        appDocumentMask
      />
    </div>
    <div>
      <input
        type="date"
        id="data_nascimento"
        [(ngModel)]="atualizarAssistido.data_nascimento"
        placeholder="Data de Nascimento"
      />
    </div>
    <div>
      <input type="file" (change)="onFileChangeEditar($event)" />
      <div *ngIf="isUploading" class="spinner"></div>
      <img *ngIf="isUploading && atualizarAssistido.imagem" [src]="atualizarAssistido.imagem" width="200" height="200" />
    </div>

    <!-- Footer com botões alinhados à direita -->
    <div class="footer-modal">
      <div class="footer-buttons-actions">
        <button (click)="closeModalEditar()" class="button">Cancelar</button>
        <button (click)="editarAssistido()" class="btn">Atualizar</button>
      </div>
    </div>
  </dialog>
</div>
