<app-header></app-header>
<div class="container">
  <h1>Dashboard</h1>

  <div *ngIf="isLoading" class="loading">Carregando dados...</div>

  <div *ngIf="!isLoading">
    <div class="stats">
      <div class="stat-card">
        <strong class="stats-detail">Total de Assistidos</strong>
        <strong class="stats-detail-value">{{ totalAssistidos }}</strong>
      </div>

      <div class="stat-card">
        <strong class="stats-detail">Total de Retiradas no Mês</strong>
        <strong class="stats-detail-value">{{ totalRetiradasMes }}</strong>
      </div>

      <div class="stat-card">
        <strong class="stats-detail">Gráfico de Retiradas</strong>
        <app-line-charts [dados]="retiradasPorMes"></app-line-charts>
      </div>

      <div class="stat-card stat-card-wide">
        <strong class="stats-detail">Retiradas por Mês</strong>
        <ul class="recent-retiradas">
          <li *ngFor="let retirada of ultimasRetiradas" class="recent-item">
            <div class="recent-details">
              <div class="recent-details-title">
                <span class="recent-details-description">{{
                  retirada.nome
                }}</span>
                <div class="recent-details-value">
                  <span>{{ retirada.documento | documentTranslate }}</span>
                  <span>{{ retirada.data_retirada | date : "MMM d, yyyy" : "UTC" }}</span>
                </div>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
