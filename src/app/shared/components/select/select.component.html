<ng-select
  [items]="items"
  [bindLabel]="bindLabel"
  [bindValue]="bindValue"
  [notFoundText]="notFoundText"
  [labelForId]="labelForId"
  [appendTo]="appendTo!"
  [(ngModel)]="selectedValue"
  dropdownPosition="bottom"
  searchable="true"
  (change)="onSelectChange(selectedValue)"
>
</ng-select>
