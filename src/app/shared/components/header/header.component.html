<header class="desktop-header">
  <div class="header-inner">
    <a class="logo" routerLink="/dashboard" aria-label="Entrega Certa — ir para o Dashboard">Entrega Certa</a>
    <nav aria-label="Navegação principal">
      <ul class="nav-list">
        <li *ngFor="let item of itens">
          <a class="nav-link" [routerLink]="item.rota" routerLinkActive="active" ariaCurrentWhenActive="page">
            <i class="fa-solid {{ item.icone }}" aria-hidden="true"></i>
            <span>{{ item.rotulo }}</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<!-- Tab Navigation para Mobile -->
<nav class="mobile-tab-nav" aria-label="Navegação principal (móvel)">
  <ul>
    <li *ngFor="let item of itens">
      <a [routerLink]="item.rota" routerLinkActive="active" ariaCurrentWhenActive="page">
        <i class="fa-solid {{ item.icone }}" aria-hidden="true"></i>
        <span>{{ item.rotulo }}</span>
      </a>
    </li>
  </ul>
</nav>
