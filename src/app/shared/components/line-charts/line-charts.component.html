<div class="chart-container">
  <canvas *ngIf="isBrowser" baseChart
          [type]="'line'"
          [data]="lineChartData"
          [options]="lineChartOptions"
          [legend]="lineChartLegend"
          role="img"
          aria-label="Gráfico de linha com o total de retiradas por mês">
  </canvas>
</div>
